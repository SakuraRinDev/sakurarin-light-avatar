<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Poka — SakuraRin Official Mascot Mock</title>
    <meta name="description" content="SakuraRin公式キャラ風の光マスコットチャットbotモック。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Inter:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="room" aria-hidden="true">
      <div class="room__sky"></div>
      <div class="room__floor"></div>
      <div class="room__horizon"></div>
      <span class="room__beam room__beam--a"></span>
      <span class="room__beam room__beam--b"></span>
      <span class="room__beam room__beam--c"></span>
      <span class="room__dust room__dust--a"></span>
      <span class="room__dust room__dust--b"></span>
      <span class="room__dust room__dust--c"></span>
      <span class="room__dust room__dust--d"></span>
    </div>

    <main class="stage" aria-label="SakuraRin公式キャラ風チャットbotと字幕">
      <header class="topbar">
        <span class="topbar__chip">
          <span class="topbar__dot" aria-hidden="true"></span>
          <span class="topbar__name">POKA</span>
        </span>
        <span class="topbar__sep" aria-hidden="true">／</span>
        <span class="topbar__sub">SakuraRin official mascot mock</span>
        <span class="topbar__status" aria-live="polite">
          <span class="topbar__pulse" aria-hidden="true"></span>
          <span id="status-label">出番待ち</span>
        </span>
      </header>

      <section class="scene" aria-label="光の塊アバター">
        <div class="wave wave--left" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>

        <div class="avatar" id="avatar">
          <span class="avatar__orbit avatar__orbit--a" aria-hidden="true"></span>
          <span class="avatar__orbit avatar__orbit--b" aria-hidden="true"></span>
          <canvas
            id="avatar-canvas"
            class="avatar__canvas"
            width="720"
            height="720"
            aria-hidden="true"
          ></canvas>
          <span class="avatar__drop avatar__drop--a" aria-hidden="true"></span>
          <span class="avatar__drop avatar__drop--b" aria-hidden="true"></span>
          <span class="avatar__drop avatar__drop--c" aria-hidden="true"></span>
          <span class="avatar__ray avatar__ray--a" aria-hidden="true"></span>
          <span class="avatar__ray avatar__ray--b" aria-hidden="true"></span>
        </div>

        <div class="wave wave--right" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </section>

      <div class="dock">
        <audio
          id="bgm-audio"
          src="assets/audio/suno-glass-archive.mp3"
          preload="auto"
          loop
        ></audio>

        <form id="compose" class="dock__bar" autocomplete="off">
          <p
            id="subtitle-text"
            class="dock__subtitle"
            aria-live="polite"
          ></p>

          <div class="dock__row">
            <span class="dock__meta">
              <span class="dock__meta-tag">字幕</span>
              <span id="subtitle-source" class="dock__meta-src">idle</span>
            </span>
            <input
              id="compose-input"
              class="dock__input"
              type="text"
              name="message"
              placeholder="ポカ、今日のおすすめは？"
              maxlength="240"
              required
            />
            <button
              id="compose-send"
              class="dock__send"
              type="submit"
              aria-label="送る"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 12l16-8-6 16-2-7-8-1Z" fill="currentColor" />
              </svg>
            </button>
          </div>
        </form>

        <button
          id="sound-toggle"
          class="dock__sound is-on"
          type="button"
          aria-label="BGMをオフにする"
          aria-pressed="true"
          title="BGM"
        >
          <span class="dock__sound-icon" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="dock__sound-label">BGM</span>
        </button>

        <a
          id="call-link"
          class="dock__call"
          href="tel:+810000000000"
          aria-label="端末の電話アプリを開く"
          title="CALL"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M7.2 4.4c.5-.5 1.3-.5 1.8 0l2 2c.5.5.5 1.2.1 1.8l-1 1.4c.9 1.8 2.4 3.3 4.2 4.2l1.4-1c.5-.4 1.3-.4 1.8.1l2 2c.5.5.5 1.3 0 1.8l-1.2 1.2c-.8.8-2 .9-3.1.5-5-1.8-8.9-5.7-10.7-10.7-.4-1.1-.3-2.3.5-3.1l1.2-1.2Z"
              fill="currentColor"
            />
          </svg>
          <span>CALL</span>
        </a>
      </div>
    </main>

    <script src="assets/js/audio.js" defer></script>
    <script src="assets/js/dialogue.js" defer></script>
    <script src="assets/js/app.js" defer></script>
  </body>
</html>
