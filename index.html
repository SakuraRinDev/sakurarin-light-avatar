<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Poka — SakuraRin Official Mascot Mock</title>
    <meta name="description" content="SakuraRin公式キャラ風の光マスコットチャットbotモック。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Inter:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="room" aria-hidden="true">
      <div class="room__sky"></div>
      <div class="room__floor"></div>
      <div class="room__horizon"></div>
      <span class="room__beam room__beam--a"></span>
      <span class="room__beam room__beam--b"></span>
      <span class="room__beam room__beam--c"></span>
      <span class="room__dust room__dust--a"></span>
      <span class="room__dust room__dust--b"></span>
      <span class="room__dust room__dust--c"></span>
      <span class="room__dust room__dust--d"></span>
    </div>

    <main class="stage" aria-label="SakuraRin公式キャラ風チャットbotと字幕">
      <header class="topbar">
        <span class="topbar__chip">
          <span class="topbar__dot" aria-hidden="true"></span>
          <span class="topbar__name">POKA</span>
        </span>
        <span class="topbar__sep" aria-hidden="true">／</span>
        <span class="topbar__sub">SakuraRin official mascot mock</span>
        <span class="topbar__status" aria-live="polite">
          <span class="topbar__pulse" aria-hidden="true"></span>
          <span id="status-label">出番待ち</span>
        </span>
        <div class="character-switch" aria-label="キャラクター切替">
          <button
            class="character-switch__button is-active"
            type="button"
            data-character="poka"
            aria-pressed="true"
          >
            POKA
          </button>
          <button
            class="character-switch__button"
            type="button"
            data-character="moko"
            aria-pressed="false"
          >
            MOKO
          </button>
        </div>
        <button
          id="feedback-toggle"
          class="topbar__feedback"
          type="button"
          aria-label="改善要望を送る"
          aria-expanded="false"
          aria-controls="feedback-panel"
        >
          要望
        </button>
        <button
          id="tools-toggle"
          class="topbar__tools"
          type="button"
          aria-label="Skills and MCPを開く"
          aria-expanded="false"
          aria-controls="tools-panel"
        >
          Tools
        </button>
      </header>

      <section class="scene" aria-label="光の塊アバター">
        <div class="wave wave--left" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>

        <div class="avatar" id="avatar">
          <span class="avatar__orbit avatar__orbit--a" aria-hidden="true"></span>
          <span class="avatar__orbit avatar__orbit--b" aria-hidden="true"></span>
          <canvas
            id="avatar-canvas"
            class="avatar__canvas"
            width="720"
            height="720"
            aria-hidden="true"
          ></canvas>
          <span class="avatar__drop avatar__drop--a" aria-hidden="true"></span>
          <span class="avatar__drop avatar__drop--b" aria-hidden="true"></span>
          <span class="avatar__drop avatar__drop--c" aria-hidden="true"></span>
          <span class="avatar__ray avatar__ray--a" aria-hidden="true"></span>
          <span class="avatar__ray avatar__ray--b" aria-hidden="true"></span>
          <div class="baby-gif" aria-hidden="true">
            <span class="baby-gif__shadow"></span>
            <span class="baby-gif__body">
              <span class="baby-gif__hair baby-gif__hair--a"></span>
              <span class="baby-gif__hair baby-gif__hair--b"></span>
              <span class="baby-gif__cheek baby-gif__cheek--left"></span>
              <span class="baby-gif__cheek baby-gif__cheek--right"></span>
              <span class="baby-gif__eye baby-gif__eye--left"></span>
              <span class="baby-gif__eye baby-gif__eye--right"></span>
              <span class="baby-gif__mouth"></span>
              <span class="baby-gif__hand baby-gif__hand--left"></span>
              <span class="baby-gif__hand baby-gif__hand--right"></span>
              <span class="baby-gif__bib"></span>
            </span>
            <span class="baby-gif__spark baby-gif__spark--a"></span>
          <span class="baby-gif__spark baby-gif__spark--b"></span>
          <span class="baby-gif__spark baby-gif__spark--c"></span>
        </div>
        <div class="baby-motion-switch" aria-label="MOKOアニメーション切替">
          <button class="baby-motion-switch__button is-active" type="button" data-baby-motion="bounce" aria-pressed="true">ぴょこ</button>
          <button class="baby-motion-switch__button" type="button" data-baby-motion="wave" aria-pressed="false">ばいばい</button>
          <button class="baby-motion-switch__button" type="button" data-baby-motion="tumble" aria-pressed="false">ころん</button>
          <button class="baby-motion-switch__button" type="button" data-baby-motion="sparkle" aria-pressed="false">きらきら</button>
        </div>
      </div>

        <div class="wave wave--right" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </section>

      <div class="dock">
        <audio
          id="bgm-audio"
          src="assets/audio/suno-glass-archive.mp3"
          preload="auto"
          loop
        ></audio>

        <form id="compose" class="dock__bar" autocomplete="off">
          <p
            id="subtitle-text"
            class="dock__subtitle"
            aria-live="polite"
          ></p>

          <div class="dock__row">
            <span class="dock__meta">
              <span class="dock__meta-tag">字幕</span>
              <span id="subtitle-source" class="dock__meta-src">idle</span>
              <span id="skill-label" class="dock__skill" aria-live="polite"></span>
              <span id="mcp-label" class="dock__mcp" aria-live="polite"></span>
            </span>
            <input
              id="compose-input"
              class="dock__input"
              type="text"
              name="message"
              placeholder="ポカ、今日のおすすめは？"
              maxlength="240"
              required
            />
            <button
              id="compose-send"
              class="dock__send"
              type="submit"
              aria-label="送る"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 12l16-8-6 16-2-7-8-1Z" fill="currentColor" />
              </svg>
            </button>
          </div>
        </form>

        <button
          id="sound-toggle"
          class="dock__sound is-on"
          type="button"
          aria-label="BGMをオフにする"
          aria-pressed="true"
          title="BGM"
        >
          <span class="dock__sound-icon" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="dock__sound-label">BGM</span>
        </button>

        <button
          id="phonebook-toggle"
          class="dock__call"
          type="button"
          aria-label="電話帳を開く"
          aria-expanded="false"
          aria-controls="phonebook"
          title="PHONE"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M7.2 4.4c.5-.5 1.3-.5 1.8 0l2 2c.5.5.5 1.2.1 1.8l-1 1.4c.9 1.8 2.4 3.3 4.2 4.2l1.4-1c.5-.4 1.3-.4 1.8.1l2 2c.5.5.5 1.3 0 1.8l-1.2 1.2c-.8.8-2 .9-3.1.5-5-1.8-8.9-5.7-10.7-10.7-.4-1.1-.3-2.3.5-3.1l1.2-1.2Z"
              fill="currentColor"
            />
          </svg>
          <span>CALL</span>
        </button>

        <button
          id="location-toggle"
          class="dock__location"
          type="button"
          aria-label="現在地を使う"
          aria-pressed="false"
          title="LOCATION"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 2.8a7.2 7.2 0 0 0-7.2 7.2c0 5.1 6.2 10.8 6.5 11 .4.3 1 .3 1.4 0 .3-.2 6.5-5.9 6.5-11A7.2 7.2 0 0 0 12 2.8Zm0 9.8a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2Z"
              fill="currentColor"
            />
          </svg>
          <span>LOC</span>
        </button>
      </div>
    </main>

    <aside
      id="phonebook"
      class="phonebook"
      aria-label="電話帳"
      aria-hidden="true"
    >
      <div class="phonebook__panel" role="dialog" aria-modal="true" aria-labelledby="phonebook-title">
        <header class="phonebook__head">
          <div>
            <p class="phonebook__eyebrow">PHONEBOOK</p>
            <h2 id="phonebook-title">連絡先</h2>
          </div>
          <button id="phonebook-close" class="phonebook__close" type="button" aria-label="電話帳を閉じる">×</button>
        </header>
        <div id="phonebook-list" class="phonebook__list" aria-live="polite"></div>
      </div>
    </aside>

    <aside
      id="feedback-panel"
      class="feedback-panel"
      aria-label="改善要望"
      aria-hidden="true"
    >
      <form class="feedback-panel__card" id="feedback-form" role="dialog" aria-modal="true" aria-labelledby="feedback-title">
        <header class="feedback-panel__head">
          <div>
            <p class="feedback-panel__eyebrow">FEEDBACK</p>
            <h2 id="feedback-title">改善要望</h2>
          </div>
          <button id="feedback-close" class="feedback-panel__close" type="button" aria-label="改善要望を閉じる">×</button>
        </header>
        <label class="feedback-panel__field">
          <span>種類</span>
          <select id="feedback-category" name="category">
            <option value="idea">アイデア</option>
            <option value="bug">不具合</option>
            <option value="request">追加してほしい</option>
            <option value="call">電話まわり</option>
            <option value="other">その他</option>
          </select>
        </label>
        <label class="feedback-panel__field">
          <span>内容</span>
          <textarea
            id="feedback-message"
            name="message"
            maxlength="600"
            rows="5"
            placeholder="ここが分かりにくい、こうしてほしい、など"
            required
          ></textarea>
        </label>
        <div class="feedback-panel__actions">
          <p id="feedback-status" class="feedback-panel__status" aria-live="polite"></p>
          <button id="feedback-submit" class="feedback-panel__submit" type="submit">送る</button>
        </div>
      </form>
    </aside>

    <aside
      id="tools-panel"
      class="tools-panel"
      aria-label="Skills and MCP"
      aria-hidden="true"
    >
      <div class="tools-panel__card" role="dialog" aria-modal="true" aria-labelledby="tools-title">
        <header class="tools-panel__head">
          <div>
            <p class="tools-panel__eyebrow">SKILLS / MCP</p>
            <h2 id="tools-title">OSツール</h2>
          </div>
          <button id="tools-close" class="tools-panel__close" type="button" aria-label="OSツールを閉じる">×</button>
        </header>
        <div class="tools-panel__grid">
          <section>
            <h3>Skills</h3>
            <div id="skills-list" class="tools-panel__list" aria-live="polite"></div>
          </section>
          <section>
            <h3>MCP Tools</h3>
            <div id="mcp-list" class="tools-panel__list" aria-live="polite"></div>
          </section>
        </div>
      </div>
    </aside>

    <script src="assets/js/audio.js" defer></script>
    <script src="assets/js/dialogue.js" defer></script>
    <script src="assets/js/phonebook.js" defer></script>
    <script src="assets/js/feedback.js" defer></script>
    <script src="assets/js/tools-panel.js" defer></script>
    <script src="assets/js/app.js" defer></script>
  </body>
</html>
